<svg xmlns="http://www.w3.org/2000/svg" width="2276" height="1280" viewBox="0 0 2276 1280" role="img" aria-label="游戏安装详情示意"><title>游戏安装详情示意</title><defs><linearGradient id="bg" x2="0.8" y2="1"><stop stop-color="#243d55"/><stop offset="1" stop-color="#0d141d"/></linearGradient><linearGradient id="red" x2="1" y2="1"><stop stop-color="#ee2f4b"/><stop offset="1" stop-color="#54142a"/></linearGradient><linearGradient id="blue" x2="1" y2="1"><stop stop-color="#187eb2"/><stop offset="1" stop-color="#12395b"/></linearGradient><linearGradient id="green" x2="1" y2="1"><stop stop-color="#478e77"/><stop offset="1" stop-color="#183a40"/></linearGradient></defs><g font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif"><rect x="0" y="0" width="2276" height="1280" rx="0" fill="url(#bg)" /><text x="60" y="80" font-size="44" fill="#fff" font-weight="800">STEAM</text><text x="285" y="78" font-size="28" fill="#acbfd3" font-weight="500">大屏模式</text><text x="1680" y="76" font-size="25" fill="#a2b9ce" font-weight="500">公开演示</text><rect x="1920" y="32" width="285" height="68" rx="34" fill="#263d51" /><circle cx="1957" cy="65" r="18" fill="#6a9bbc"/><text x="1992" y="76" font-size="25" fill="#eff6ff" font-weight="500">示意账号</text><rect x="45" y="140" width="2186" height="430" rx="18" fill="url(#blue)" /><path d="M1200 140L2000 140L1650 570H860Z" fill="#080d17" opacity=".3"/><text x="100" y="320" font-size="90" fill="#fff" font-weight="900">METAPHOR</text><text x="106" y="397" font-size="36" fill="#f2dbe1" font-weight="500">幻想世界 · 安装流程演示</text><text x="108" y="494" font-size="26" fill="#e3c8d2" font-weight="500">游戏详情 · 公开演示界面</text><rect x="65" y="615" width="330" height="88" rx="7" fill="#467f9b" /><text x="123" y="672" font-size="34" fill="#fff" font-weight="700">↓  安装游戏</text><text x="445" y="654" font-size="24" fill="#9db2c8" font-weight="500">当前状态</text><text x="445" y="696" font-size="29" fill="#e5eff9" font-weight="500">尚未安装 · 演示</text><text x="900" y="654" font-size="24" fill="#9db2c8" font-weight="500">账号与游玩信息</text><text x="900" y="696" font-size="29" fill="#e5eff9" font-weight="500">此处不展示真实数据</text><rect x="65" y="758" width="2140" height="90" rx="8" fill="#172938" /><text x="104" y="816" font-size="27" fill="#c4d8e7" font-weight="500">☁  云存档状态示意 · 以实际服务结果为准</text><text x="70" y="916" font-size="31" fill="#fff" font-weight="700">游戏信息</text><text x="70" y="975" font-size="26" fill="#9eb4cb" font-weight="500">选择游戏、准备环境、开始游玩。原型中的状态和数值仅用于交互演示。</text><text x="70" y="1030" font-size="25" fill="#9eb4cb" font-weight="500">公开版本已移除账号头像、好友列表和个人游玩记录。</text><rect x="0" y="1190" width="2276" height="90" rx="0" fill="#0a1019" /><rect x="50" y="1213" width="130" height="44" rx="22" fill="#eaf2ff" /><text x="73" y="1245" font-size="24" fill="#17212c" font-weight="700">STEAM</text><text x="215" y="1245" font-size="27" fill="#bbcbdc" font-weight="500">大屏模式 · 交互示意</text><text x="1760" y="1245" font-size="24" fill="#a8bdd4" font-weight="500">演示素材 · 无真实账号数据</text></g></svg>